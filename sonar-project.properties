# SonarQube Cloud analysis of this repository. Run by .github/workflows/sonar-aideas-repo.yml
# — see ideas/quality-gate/README.md.
#
# Two ideas have no upstream repository of their own — aideas and gnome-tasks are both built
# here — so they share this project. There is no per-directory badge in SonarQube Cloud, so
# both READMEs carry the same badge and say that it covers the whole repository.
sonar.projectKey=gortazar_aideas
sonar.organization=gortazar
sonar.sourceEncoding=UTF-8

# The GJS extensions, the browser half of gnome-tasks, the orchestrator, and the in-repo
# tools. Everything else at this level is prose: PLAN.md, STATUS.md, docs/, screenshots/.
sonar.sources=ideas/aideas/src,ideas/aideas/tools,ideas/gnome-tasks/src,ideas/gnome-tasks/browser,ideas/gnome-tasks/tools,orchestrator
sonar.tests=ideas/aideas/tests,ideas/gnome-tasks/tests

# ideas/<slug>/upstream is a git submodule: another repository, with its own SonarQube Cloud
# project. Counting it here would both double-count every line and wreck this project's
# numbers, so it is excluded twice over — the analysis checkout does not initialise
# submodules either, but an exclusion that only holds by accident is one refactor from
# failing silently.
sonar.exclusions=ideas/*/upstream/**

# Vendored or generated, not written here.
sonar.cpd.exclusions=**/*.min.js
