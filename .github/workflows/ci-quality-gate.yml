# Generated from ideas/_template/ci.yml. Edit freely — it is only created once, never
# regenerated, so your changes to the real test command will stick.
name: CI - quality-gate

# What this idea delivers lives at this repo's root, not under ideas/quality-gate/:
# the reusable workflow and the workflow that tags it. Both are in the path filter, so
# editing sonar.yml re-runs the lint that would catch a broken one before six other
# repositories start calling it.
on:
  push:
    paths:
      - "ideas/quality-gate/**"
      - ".github/workflows/ci-quality-gate.yml"
      - ".github/workflows/sonar.yml"
      - ".github/workflows/tag-sonar.yml"
      - ".github/workflows/sonar-aideas-repo.yml"
  pull_request:
    paths:
      - "ideas/quality-gate/**"
      - ".github/workflows/ci-quality-gate.yml"
      - ".github/workflows/sonar.yml"
      - ".github/workflows/tag-sonar.yml"
      - ".github/workflows/sonar-aideas-repo.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideas/quality-gate
    steps:
      - uses: actions/checkout@v4

      # check-wiring.sh reads the submodule working trees — the caller workflow and
      # sonar-project.properties of five of the six projects live in them — so an
      # unpopulated submodule has to be a checkout failure here, not a silent skip.
      #
      # `submodules: recursive` on the checkout cannot be used: ideas/vacas/upstream is a
      # gitlink in the index with no entry in .gitmodules, and git aborts the whole update
      # with "No url found for submodule path". That belongs to another idea, so instead of
      # editing it, initialise exactly the submodules .gitmodules does declare.
      - name: Check out the declared submodules
        working-directory: .
        run: |
          set -euo pipefail
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' |
            awk '{print $2}' |
            xargs git submodule update --init --depth=1 --
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # shellcheck over scripts/, sandboxed against this directory alone.
      - run: nix flake check
      # actionlint over the workflows this idea owns, and check-wiring.sh over the
      # whole checkout — both read files above ideas/quality-gate/, which the
      # sandboxed check cannot see.
      - run: nix run .#lint
