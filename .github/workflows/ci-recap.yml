# Generated from ideas/_template/ci.yml. Edit freely — it is only created once, never
# regenerated, so your changes to the real test command will stick.
name: CI - recap

on:
  push:
    paths:
      - "ideas/recap/**"
      - ".github/workflows/ci-recap.yml"
  pull_request:
    paths:
      - "ideas/recap/**"
      - ".github/workflows/ci-recap.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideas/recap
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # --print-build-logs so a failing `go test` shows its output in the job log
      # instead of just "builder failed with exit code 1".
      - run: nix flake check --print-build-logs
