# The wrapper's own check. The extension's real test suite lives upstream, in
# gortazar/meet, and runs there on every push and pull request — this asserts that what
# this repository records about the idea is coherent: the submodule pointer resolves, the
# two pins name one commit, STATUS.md says what it is supposed to say, and upstream's own
# checks pass at the commit this idea points at.
name: CI - meet

on:
  push:
    paths:
      - "ideas/meet/**"
      - ".github/workflows/ci-meet.yml"
  pull_request:
    paths:
      - "ideas/meet/**"
      - ".github/workflows/ci-meet.yml"

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A gitlink pointing at a commit that no longer exists — the classic aftermath of a
      # squash merge with --delete-branch — makes the submodule resolve nowhere, and the
      # checkout above is what notices.
      - name: The submodule pointer resolves
        working-directory: ideas/meet
        run: |
          pin="$(git ls-files -s upstream | awk '$1 == "160000" { print $2 }')"
          test -n "$pin" || { echo "no gitlink recorded at ideas/meet/upstream" >&2; exit 1; }
          echo "upstream/ is pinned at $pin"
          git -C upstream cat-file -e "$pin^{commit}"
          test -f upstream/src/metadata.json

      - name: STATUS.md says where the idea is
        working-directory: ideas/meet
        run: |
          grep -Eq '^status: (not_started|in_progress|done|blocked)$' STATUS.md
          grep -Eq '^version: [0-9]+\.[0-9]+$' STATUS.md

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # The submodule and the meet-src flake input have to name one commit. Left to drift,
      # the check below would happily test a commit nobody is working on and report green.
      - name: The two pins agree
        working-directory: ideas/meet
        run: ./scripts/check-pin.sh

      # Upstream's own checks — ESLint, the headless suite, the packed zip — at that commit.
      - name: Upstream's checks, at the pinned commit
        working-directory: ideas/meet
        run: nix flake check --print-build-logs
