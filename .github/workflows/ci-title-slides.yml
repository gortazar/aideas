# Generated from ideas/_template/ci.yml. Edit freely — it is only created once, never
# regenerated, so your changes to the real test command will stick.
name: CI - title-slides

on:
  push:
    paths:
      - "ideas/title-slides/**"
      - ".github/workflows/ci-title-slides.yml"
  pull_request:
    paths:
      - "ideas/title-slides/**"
      - ".github/workflows/ci-title-slides.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideas/title-slides
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: nix flake check
