# Generated from ideas/_template/ci.yml. Edit freely — it is only created once, never
# regenerated, so your changes to the real test command will stick.
name: CI - title-slides

on:
  push:
    paths:
      - "ideas/title-slides/**"
      - ".github/workflows/ci-title-slides.yml"
  pull_request:
    paths:
      - "ideas/title-slides/**"
      - ".github/workflows/ci-title-slides.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideas/title-slides
    steps:
      # The submodule pin is read from the git index, so the submodule contents are
      # not needed here — the sources come from the flake input instead.
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # The idea's real test suite runs upstream, in gortazar/title-slides. What is
      # checked here is the wrapper: that both pins name the same upstream commit,
      # and that the extension at that commit is well-formed and its tests pass.
      - run: nix develop --command scripts/check-pin.sh
      - run: nix flake check --print-build-logs
