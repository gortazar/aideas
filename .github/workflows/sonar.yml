# The one SonarQube Cloud analysis every idea calls.
#
# AGENTS.md tells every idea to wire itself up with
# `uses: gortazar/aideas/.github/workflows/sonar.yml@v1` — this is that workflow. It
# exists so there is exactly one place where the scanner version, the skip rules and
# the fetch depth are decided; a fleet of subtly different per-idea Sonar configs is
# worse than none.
#
# The smallest caller is five lines:
#
#     sonar:
#       uses: gortazar/aideas/.github/workflows/sonar.yml@v1
#       secrets:
#         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#
# which analyses the whole repository as project `gortazar_<repo-name>` in the
# `gortazar` organisation, taking sonar.sources, sonar.tests and the exclusions from
# the caller's own sonar-project.properties. Everything below is for the cases that
# need more than that.
#
# `v1` is a moving major tag, force-updated by tag-sonar.yml on every push to main
# that touches this file, so a fix here reaches all six callers without any of them
# being edited.
#
# **This job blocks.** `fail-on-gate` defaults to true, which makes the scanner wait for
# the analysis to finish and exit non-zero on a red gate, so this job's `sonar / Analysis`
# check run is a truthful statement about the gate — and that is the check the branch
# rulesets on the idea repositories require. An agent that meets a red gate has a defined
# move, spelled out in AGENTS.md and summarised in this job's step summary; "bypass" is not
# among them.
name: SonarQube Cloud

on:
  workflow_call:
    inputs:
      project-key:
        description: >
          SonarQube Cloud project key. Defaults to gortazar_<repo-name>, which is what
          binding a repository through the SonarCloud GitHub App produces.
        type: string
        required: false
        default: ""
      organization:
        description: SonarQube Cloud organization key.
        type: string
        required: false
        default: gortazar
      extra-args:
        description: Extra -Dsonar.* arguments, appended to the scanner command line.
        type: string
        required: false
        default: ""
      coverage-artifact:
        description: >
          Name of an artifact uploaded earlier in the calling run holding a coverage
          report. Left empty, no coverage is reported and Sonar records 0% on new
          code — or ignores the condition entirely, if the new-code period has fewer
          than 20 new lines. Those are different answers; see ideas/quality-gate/baseline.md.
        type: string
        required: false
        default: ""
      coverage-path:
        description: Directory to unpack coverage-artifact into, relative to the workspace.
        type: string
        required: false
        default: "."
      working-directory:
        description: sonar.projectBaseDir — where sonar-project.properties lives.
        type: string
        required: false
        default: "."
      runs-on:
        description: Runner label for the analysis job.
        type: string
        required: false
        default: ubuntu-latest
      fail-on-gate:
        description: >
          Wait for the analysis to finish and fail the job if the quality gate is red.
          On by default: this job's check run is what branch rulesets require, so a
          scan that returns before the gate is known would make the requirement
          meaningless. Set false only for a repository being onboarded, and say why.
        type: boolean
        required: false
        default: true
    secrets:
      SONAR_TOKEN:
        # Not required, so that the skip path below is reachable. A pull request from
        # a fork gets no secrets at all, and a repository can be wired up before its
        # token is set: neither should turn a build red over a gate that could not be
        # evaluated in the first place.
        required: false

jobs:
  sonar:
    name: Analysis
    runs-on: ${{ inputs.runs-on }}
    # contents: read and nothing else, deliberately. Five of the six repositories that call
    # this have their default workflow token set to "read repository contents", where
    # `pull-requests: read` is not merely unset but *ungrantable* — asking for it made the
    # whole run fail before a single job started, with "the nested job 'sonar' is requesting
    # 'pull-requests: read', but is only allowed 'pull-requests: none'". Nothing here needs
    # it: pull request decoration is done by the SonarQube Cloud GitHub App against its own
    # installation token, not by this workflow's.
    permissions:
      contents: read
    steps:
      # First, because everything after it is conditional on the answer. An empty secret
      # is the normal state for a pull request from a fork, and for a repository being
      # wired up before its token is set. This says so once, clearly, and **succeeds**.
      #
      # That is a deliberate hole in an otherwise blocking gate, and worth being honest
      # about: on a fork pull request the gate is unenforced by construction, because
      # GitHub gives the run no secret to analyse with. Failing instead would not close
      # the hole — it would only stop fork pull requests from ever being mergeable.
      - name: Is there a token?
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "have-token=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have-token=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarQube Cloud analysis skipped::No SONAR_TOKEN is available to this run (pull requests from forks get no secrets, and a repository can be wired up before its token is set). Skipping the analysis rather than failing, because there is nothing to enforce a gate against."
            {
              echo "### SonarQube Cloud analysis skipped"
              echo
              echo "No \`SONAR_TOKEN\` was available to this run — a pull request from a fork gets"
              echo "no secrets, and a repository can be wired up before its token is set."
              echo
              echo "**No analysis ran, so no gate was evaluated.** This job succeeds so the run is"
              echo "not blocked on a check that could never have been made; it is not evidence that"
              echo "anything passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # fetch-depth: 0 is not optional. Sonar attributes new code by git blame, and
      # against a shallow clone every line looks new — which would make the one thing
      # this gate judges, "new code", quietly wrong.
      - uses: actions/checkout@v4
        if: steps.token.outputs.have-token == 'yes'
        with:
          fetch-depth: 0

      # The project key defaults to the repository name rather than being written out
      # in six callers. Computed in a step, not in the input's `default:`, because a
      # workflow_call default cannot read the github context.
      - name: Which project
        id: project
        if: steps.token.outputs.have-token == 'yes'
        env:
          PROJECT_KEY: ${{ inputs.project-key }}
          ORGANIZATION: ${{ inputs.organization }}
        run: |
          set -euo pipefail
          key="$PROJECT_KEY"
          if [ -z "$key" ]; then
            key="${ORGANIZATION}_${GITHUB_REPOSITORY##*/}"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "analysing $key in organization $ORGANIZATION"

      # Coverage is an input, not something this workflow knows how to produce. Four
      # repositories here have four different test runners, three of them inside a
      # nix sandbox; teaching one workflow to drive all of them would make it the
      # thing nobody dares change. A caller that starts producing coverage uploads it
      # as an artifact and names it here — two lines, and no nix in this file.
      - name: Fetch the coverage report
        if: steps.token.outputs.have-token == 'yes' && inputs.coverage-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.coverage-path }}

      - name: Scan
        id: scan
        if: steps.token.outputs.have-token == 'yes'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL is deliberately unset: the action targets SonarQube Cloud
          # when it has no host, and setting one is how you point it at a server.
          #
          # The scanner reads the pull request number, branch and base from the
          # runner's own environment; the token lets it resolve them against the API
          # so the analysis is attributed to the PR rather than to a branch. Read-only
          # is enough — see the permissions block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          # Everything else — sources, tests, exclusions — comes from the caller's
          # sonar-project.properties, which is version-controlled beside the code it
          # describes rather than buried in a workflow input.
          #
          # sonar.qualitygate.wait is what makes this job's check run mean anything.
          # Without it the scanner exits as soon as the report is uploaded, long before
          # the compute engine has decided anything, and the job goes green whatever the
          # gate says. With it the scanner polls the task to completion and exits
          # non-zero on a red gate — so "sonar / Analysis passed" and "the gate is green"
          # become the same statement, which is the one a ruleset can require.
          args: >
            -Dsonar.projectKey=${{ steps.project.outputs.key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.qualitygate.wait=${{ inputs.fail-on-gate }}
            ${{ inputs.extra-args }}

      # Runs whether the scan passed or failed — `if: always()` on the step, guarded by
      # the token check — because the summary matters most when the gate is red and the
      # question is "what do I do now".
      - name: Where to read the result
        if: always() && steps.token.outputs.have-token == 'yes'
        env:
          KEY: ${{ steps.project.outputs.key }}
          BLOCKING: ${{ inputs.fail-on-gate }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### SonarQube Cloud"
            echo
            echo "[\`$KEY\` dashboard](https://sonarcloud.io/summary/new_code?id=$KEY)"
            echo
            if [ "$BLOCKING" != "true" ]; then
              echo "The quality gate is **not enforced** in this run: \`fail-on-gate\` is off,"
              echo "so the scan returned as soon as the analysis was submitted and this job"
              echo "says nothing about what the gate decided."
            elif [ "$OUTCOME" = "failure" ]; then
              echo "**The quality gate is red, and that is why this job failed.**"
              echo
              echo "Read what failed, from a checkout of the aideas repository:"
              echo
              echo '```sh'
              echo "ideas/quality-gate/scripts/pr-gate.sh ${GITHUB_REPOSITORY##*/} <pr-number>"
              echo '```'
              echo
              echo "A real finding is fixed in this same pull request. A false positive of a"
              echo "class \`ideas/quality-gate/baseline.md\` already catalogues gets a narrow"
              echo "exclusion in this repository's \`sonar-project.properties\`, in this same"
              echo "pull request, with a row appended to \`ideas/quality-gate/exclusions.md\`."
              echo "Never a blanket exclusion, and never a bypass."
            else
              echo "The quality gate is green, and this job waited for it to say so."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
