# Tune these any time — the orchestrator re-reads this file every cycle.
#
# Note on the cost figures below: the orchestrator box authenticates with a Claude
# subscription token (`claude setup-token`), not a metered API key. The `total_cost_usd`
# that `claude -p --output-format json` reports is therefore the *equivalent* API value of
# the work, not money actually billed to you. Use it as a consistent proxy for "how much
# of my allowance did this burn" — your real ceiling is the plan's rolling 5-hour and
# weekly windows, not a daily dollar figure.

# How many ideas to build concurrently, each by its own agent. Agents get a private git
# worktree and branch, so their commits don't collide; the branches are merged back at
# the end of the cycle. Raising this multiplies spend by roughly the same factor, and
# every agent shares your one rolling usage allowance.
parallel_agents: 2

# --- Limits -------------------------------------------------------------------------
# Any of the three cost knobs and allowed_hours accept "unlimited" (also "none"/"off")
# to switch that limit off entirely. With max_cycle_cost_usd unlimited, no
# --max-budget-usd is passed and a single agent runs until it decides it is finished —
# there is then nothing bounding a cycle except the work running out. Combined with
# parallel_agents above, an unlimited overnight run can consume your whole allowance.

# Stop starting new cycles once today's cumulative equivalent cost reaches this.
# The orchestrator tracks it in .orchestrator/usage.log, summed per calendar day.
max_daily_cost_usd: 150.00

# Safety valve per build cycle, independent of the daily budget above. Passed straight
# through to `claude --max-budget-usd`, so it aborts a runaway cycle mid-flight rather
# than only being noticed after the fact. Note it is approximate: a cycle capped at
# $1.50 has been observed finishing at $1.53, and it stops mid-tool-call rather than at
# a tidy stopping point.
max_cycle_cost_usd: 50.00

# Same valve for the cheaper planning pass, which only reads and writes PLAN.md.
max_plan_cost_usd: 0.40

# Only allowed to run within this local-time window each day. Supports overnight ranges.
# Set to "unlimited" to run at any hour.
allowed_hours: "unlimited"
timezone: "Europe/Lisbon"

# How long a heartbeat can go without an update before a Claude Code session on the
# laptop is considered idle (covers crashes, long-running commands, and suspend/sleep).
heartbeat_staleness_minutes: 10

# Wall-clock ceiling for the whole cycle, counted from when the script starts — planning
# included, since systemd's TimeoutStartSec counts that too. When it's reached the agents
# are asked to stop and the cycle still commits, merges and pushes what they had: a
# graceful wind-down rather than a kill. This is the knob that keeps a cycle finishing on
# its own terms instead of being SIGTERMed by systemd, so keep this ordering intact:
#
#   max_cycle_minutes  <  lock_ttl_minutes  <  TimeoutStartSec in the systemd unit
#
# The first gap stops a second cycle reclaiming the lock while this one is still running;
# the second leaves time for the merge and push after the agents stop. Accepts
# "unlimited", which removes the ceiling — and with it the guarantee of either.
max_cycle_minutes: 45

# How long an agent gets to shut down after being asked, before it's killed outright.
agent_grace_seconds: 90

# How long the repo lock can be held before it's considered abandoned and reclaimed.
lock_ttl_minutes: 60

# If the current top-priority idea has been "in_progress" for longer than this without
# completing, allow the orchestrator to pick an easier unstarted idea instead this cycle.
stale_idea_after_hours: 6
