    <path d="M5.9 11.1h4.2v1.3H5.9z"/>
    <path d="M6.6 13.1h2.8v1.3H6.6z"/>
    <!-- three rays: top, upper-left, upper-right, each clear of the glass -->
    <path d="M7.3 0h1.4v1.9H7.3z"/>
    <path d="M0.85 2.1l0.99-0.99 1.5 1.5-0.99 0.99z"/>
    <path d="M12.66 2.61l1.5-1.5 0.99 0.99-1.5 1.5z"/>
