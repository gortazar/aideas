<?xml version="1.0" encoding="UTF-8"?>
<!-- A lit bulb: solid glass, and rays around it. A cycle is running.
     Symbolic: one colour, and that colour is currentColor, so the shell recolours it to the
     panel foreground rather than blitting a picture of a bulb.
     The glass and base are identical to the other three bulbs — only the drawing inside and
     around them changes between states, so the button does not appear to grow or shrink as the
     queue moves. The rays live in the corners the circular glass leaves free. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="currentColor">
    <!-- the glass, with a flat bottom where the base meets it -->
    <path d="M8 1.4a4.6 4.6 0 0 0-2.3 8.58v0.72h4.6V9.98A4.6 4.6 0 0 0 8 1.4z"/>
    <!-- the screw base, two bands -->
    <path d="M6.25 11.4h3.5v1.2h-3.5z"/>
    <path d="M6.7 13.1h2.6v1.2H6.7z"/>
    <!-- rays: two at the sides, two in the upper corners -->
    <path d="M0.5 5.4h1.9v1.2H0.5z"/>
    <path d="M13.6 5.4h1.9v1.2h-1.9z"/>
    <path d="M1.72 1.3l0.85-0.85 1.4 1.4-0.85 0.85z"/>
    <path d="M12.03 1.85l1.4-1.4 0.85 0.85-1.4 1.4z"/>
  </g>
</svg>
