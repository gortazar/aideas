<!-- Every idea is blocked: nothing will move until a person answers something. A solid bulb
     struck through, which is the one silhouette here with a straight bar crossing it and reads
     as a stop at a glance — louder than an unlit bulb, which at 16px is only a hollow one and
     would be confusable with idle. The badge beside it carries how many are waiting. -->
